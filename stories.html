<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Store</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f4f4f4;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  /* Style for the clickable logo at the top */
  #logo {
    cursor: pointer;
    border-radius: 8px;
  }
  /* Container for store brands in a single line */
  .brands {
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 15px;
    padding: 10px;
    margin-bottom: 30px;
    transition: transform 0.5s;
  }
  /* Style for each store link and logo */
  .brand a {
    display: block;
    text-align: center;
  }
  .brand img {
    width: 100px;
    height: auto;
    display: block;
    border-radius: 4px;
  }
  /* Contact form styling */
  .contact-section {
    max-width: 600px;
    margin: 0 auto 40px auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
  }
  .contact-section h2 {
    text-align: center;
    margin-bottom: 15px;
  }
  /* Styling form elements */
  form {
    display: flex;
    flex-direction: column;
  }
  label {
    margin-top: 10px;
    margin-bottom: 5px;
    font-weight: bold;
  }
  select, input[type="text"], input[type="email"], input[type="tel"] {
    padding: 8px;
    margin-bottom: 10px;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
  button {
    padding: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover {
    background-color: #0056b3;
  }
  /* Centered image container style */
  .image-center {
    text-align: center;
    margin-bottom: 10px;
  }
  /* Bounce animation keyframes */
  @keyframes bounce {
    0% { transform: translateY(0); }
    20% { transform: translateY(-20px); }
    40% { transform: translateY(0); }
    60% { transform: translateY(-10px); }
    80% { transform: translateY(0); }
    100% { transform: translateY(0); }
  }
  /* Bounce class to trigger animation */
  .bounce {
    animation: bounce 0.5s;
  }
  /* Footer styling */
  .footer {
    background-color: #007BFF;
    color: #fff;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <!-- Clickable logo at the top -->
  <a href="index.html">
    <img src="img/output (1).png" alt="Store Logo" id="logo" style="width:200px;">
    <p style="text-align:center; margin-top:10px;">Home Page</p>
  </a>
</header>

<h1 style="text-align:center;">Welcome to Our Online Store</h1>

<div class="brands" id="brandsContainer">
  <!-- Store logos with links and data-store attribute for bounce -->
  <div class="brand">
    <a href="https://umg/checkers.pnd" target="_blank" data-store="Checkers">
      <img src="img/checkers.png" alt="Checkers" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/pick-n-pay" target="_blank" data-store="Pick n Pay">
      <img src="img/pick-n-pay.png" alt="Pick n Pay" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/shoprite" target="_blank" data-store="Shoprite">
      <img src="img/shoprite.png" alt="Shoprite" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/woolworths" target="_blank" data-store="Woolworths">
      <img src="img/woolworths.png" alt="Woolworths" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/mcdonalds" target="_blank" data-store="McDonald's">
      <img src="img/mcdonalds.png" alt="McDonald's" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/steers" target="_blank" data-store="Steers">
      <img src="img/steers.png" alt="Steers" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/debonairs" target="_blank" data-store="Debonairs Pizza">
      <img src="img/debonairs.png" alt="Debonairs Pizza" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/nandos" target="_blank" data-store="Nando's">
      <img src="img/nandos.png" alt="Nando's" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/burgerking" target="_blank" data-store="Burger King">
      <img src="img/burgerking.png" alt="Burger King" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/uber-eats" target="_blank" data-store="Uber Eats">
      <img src="img/uber-eats.png" alt="Uber Eats" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/mr-d" target="_blank" data-store="Mr D">
      <img src="img/mr-d.png" alt="Mr D" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/yassir" target="_blank" data-store="Yassir">
      <img src="img/yassir.png" alt="Yassir" />
    </a>
  </div>
  <div class="brand">
    <a href="https://umg/yassir" target="_blank" data-store="Yassir">
      <img src="img/yassir2.png" alt="Yassir" />
    </a>
  </div>
  <div class="brand">
    <a href="https://https://order.kfc.co.za/" target="_blank" data-store="kfc">
      <img src="img/kfc.jpg" alt="kfc" />
    </a>
  </div>
</div>

<!-- Contact Form Section with image above and list of items to buy -->
<div class="contact-section">
  <h2>Contact Us</h2>
  <form id="contactForm" action="https://formsubmit.co/siyandahlophe860@gmail.com" method="POST">
    <!-- Image shown above the store select -->
    <div class="image-center">
      <img id="selected-store-img" src="" alt="" style="display:none; max-width:150px; border:1px solid #ccc; padding:5px;">
    </div>
    <label for="store">Select Store:</label>
    <select id="store" name="store" required>
      <option value="">--Choose a store--</option>
      <option value="Checkers">Checkers</option>
      <option value="Pick n Pay">Pick n Pay</option>
      <option value="Shoprite">Shoprite</option>
      <option value="Woolworths">Woolworths</option>
      <option value="McDonald's">McDonald's</option>
      <option value="Steers">Steers</option>
      <option value="Debonairs Pizza">Debonairs Pizza</option>
      <option value="Nando's">Nando's</option>
      <option value="Burger King">Burger King</option>
      <option value="Uber Eats">Uber Eats</option>
      <option value="Mr D">Mr D</option>
      <option value="Kfc">KFC</option>
    </select>
    <!-- List of items to buy -->
    <label for="items">Items to Buy:</label>
    <select id="items" name="items" required>
      <option value="">--Select item--</option>
      <option value="Groceries">Groceries</option>
      <option value="Fast Food">Fast Food</option>
      <option value="Electronics">Electronics</option>
      <option value="Clothing">Clothing</option>
      <option value="Accessories">Accessories</option>
      <option value="Home Goods">Home Goods</option>
      <option value="Other">Other</option>
    </select>
    <!-- Textarea for additional info based on selection -->
    <label for="Write Your list">Write Your list:</label>
    <textarea id="Write Your list" name="Write Your list" rows="4" placeholder="Write additional details here..." style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc;"></textarea>
    <label for="name">Your Name:</label>
    <input type="text" id="name" name="name" placeholder="Your Name" required>
    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone" placeholder="Your Phone Number" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
    <button type="submit">Send</button>
  </form>
</div>

<!-- Footer with social icons -->
<div class="footer">
  <footer>
    <div id="social-media" style="margin-top: 30px; text-align: center;">
      <h3 style="color:#ffffff; margin-bottom: 15px;">Follow Us</h3>
      <a href="https://web.facebook.com/sk.hlophe.5" target="_blank" aria-label="Facebook" style="margin: 0 10px; display: inline-block;">
        <img src="https://cdn-icons-png.flaticon.com/24/733/733547.png" alt="Facebook" style="width:24px; height:24px; vertical-align: middle;">
      </a>
      <a href="https://twitter.com" target="_blank" aria-label="Twitter" style="margin: 0 10px; display: inline-block;">
        <img src="https://cdn-icons-png.flaticon.com/24/733/733579.png" alt="Twitter" style="width:24px; height:24px; vertical-align: middle;">
      </a>
      <a href="https://instagram.com" target="_blank" aria-label="Instagram" style="margin: 0 10px; display: inline-block;">
        <img src="https://cdn-icons-png.flaticon.com/24/2111/2111463.png" alt="Instagram" style="width:24px; height:24px; vertical-align: middle;">
      </a>
      <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn" style="margin: 0 10px; display: inline-block;">
        <img src="https://cdn-icons-png.flaticon.com/24/174/174857.png" alt="LinkedIn" style="width:24px; height:24px; vertical-align: middle;">
      </a>
    </div>
    <p>&copy; 2026 MR WHITE DELIVERIES AND PROJECTS. All rights reserved.</p>
  </footer>
</div>

<script>
  const storeSelect = document.getElementById('store');
  const storeImg = document.getElementById('selected-store-img');

  const storeImages = {
    "Checkers": "img/checkers.png",
    "Pick n Pay": "img/pick-n-pay.png",
    "Shoprite": "img/shoprite.png",
    "Woolworths": "img/woolworths.png",
    "McDonald's": "img/mcdonalds.png",
    "Steers": "img/steers.png",
    "Debonairs Pizza": "img/debonairs.png",
    "Nando's": "img/nandos.png",
    "Burger King": "img/burgerking.png",
    "Uber Eats": "img/uber-eats.png",
    "Mr D": "img/mr-d.png",
    "Yassir": "img/yassir.png",
    "Kfc": "img/kfc.jpg"
  };

  // When store dropdown changes, update image
  document.getElementById('store').addEventListener('change', () => {
    const storeName = document.getElementById('store').value;
    if (storeName && storeImages[storeName]) {
      storeImg.src = storeImages[storeName];
      storeImg.alt = storeName;
      storeImg.style.display = 'block';
    } else {
      storeImg.style.display = 'none';
    }
  });

  // Animate the brands container on store select change
  const brandsContainer = document.getElementById('brandsContainer');
  document.getElementById('store').addEventListener('change', () => {
    brandsContainer.classList.remove('bounce');
    void brandsContainer.offsetWidth; // reflow
    brandsContainer.classList.add('bounce');
  });

  // Bounce when clicking the logo
  document.querySelector('#logo').addEventListener('click', () => {
    brandsContainer.classList.remove('bounce');
    void brandsContainer.offsetWidth;
    brandsContainer.classList.add('bounce');
  });

  // Bounce on clicking any store logo link
  document.querySelectorAll('.brand a').forEach(link => {
    link.addEventListener('click', () => {
      brandsContainer.classList.remove('bounce');
      void brandsContainer.offsetWidth;
      brandsContainer.classList.add('bounce');
    });
  });

  const itemSelect = document.getElementById('items');
  const additionalInfo = document.getElementById('Write Your list');

  const itemDescriptions = {
    "Groceries": "Please specify the types of groceries you need.",
    "Fast Food": "Mention your favorite fast food items or preferences.",
    "Electronics": "Specify the electronic gadgets or accessories.",
    "Clothing": "Describe the clothing items you're interested in.",
    "Accessories": "List the accessories you'd like to inquire about.",
    "Home Goods": "Mention the home goods or furniture.",
    "Other": "Provide any additional details or specify other items."
  };

  itemSelect.addEventListener('change', () => {
    const selectedItem = itemSelect.value;
    if (itemDescriptions[selectedItem]) {
      additionalInfo.value = itemDescriptions[selectedItem];
    } else {
      additionalInfo.value = "";
    }
  });
</script>
</body>
</html>
