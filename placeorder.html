<!-- Place your form here -->
<section id="order" style="padding:40px 20px; background:#f4f4f4;">
<h2 style="text-align:center;">Place an Order</h2>
<div class="contact-form">
<form action="https://formsubmit.co/siyandahlophe860@gmail.com" method="POST" id="orderForm">
  <div class="form-group">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required>
  </div>
  <div class="form-group">
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>
  </div>
  <div class="form-group">
    <label for="phone">Phone / WhatsApp:</label>
    <input type="text" id="phone" name="phone" required>
  </div>
  <!-- Service selection -->
  <div class="form-group">
    <label for="service">Select Service:</label>
    <select id="service" name="service" required>
      <option value="">--Please choose an option--</option>
      <option value="Food & Takeaways">Food & Takeaways</option>
      <option value="Groceries & Beverages">Groceries & Beverages</option>
      <option value="Medication & Pharmacy Orders">Medication & Pharmacy Orders</option>
      <option value="Parcels & Documents">Parcels & Documents</option>
      <option value="Small Packages">Small Packages</option>
    </select>
  </div>
  <!-- Distance -->
  <div class="form-group">
    <label for="distance">Select Distance (from the pickup to the dropoff):</label>
    <select id="distance" name="distance" onchange="updatePrice()" required>
      <option value="">--Choose Distance--</option>
      <option value="5">km</option>
      <option value="10">km</option>
      <option value="20">km</option>
      <option value="30">km</option>
      <option value="40">km</option>
      <option value="50">km</option>
      <option value="60">km</option>
    </select>
  </div>
  <!-- Price display -->
  <div id="priceDisplay"></div>
  <!-- Pickup address -->
  <div class="form-group">
    <label for="pickupAddress">Pickup Address Location:</label>
    <input type="text" id="pickupAddress" name="pickupAddress" placeholder="Enter pickup location" required>
  </div>
  <!-- Dropoff address -->
  <div class="form-group">
    <label for="dropoffAddress">Dropoff Address Location:</label>
    <input type="text" id="dropoffAddress" name="dropoffAddress" placeholder="Enter delivery location" required>
  </div>
  <!-- Schedule Delivery: Date & Time -->
  <div class="form-group">
    <label for="deliveryDate">Select Delivery Date:</label>
    <input type="date" id="deliveryDate" name="deliveryDate" required>
  </div>
  <div class="form-group">
    <label for="deliveryTime">Select Delivery Time:</label>
    <input type="time" id="deliveryTime" name="deliveryTime" required>
  </div>
  <!-- Additional message -->
  <div class="form-group">
    <label for="message">Additional Details / Message:</label>
    <textarea id="message" name="message" rows="4" placeholder="Provide any additional info or instructions..."></textarea>
  </div>


  <label for="response">When will you want to receive your delivery</label>
        <select id="Deliver" name="Deliver">
           <option value="immediately">Choose</option>
          <option value="immediately">Immediately</option>
          <option value="within7days">Within 7 days</option>
          <option value="anytime">Anytime</option>

  <!-- Hidden Subject -->
  <input type="hidden" name="_subject" value="New Delivery Inquiry/Order" />
  <!-- Submit button -->
  <button type="submit">Send</button>
</form>
